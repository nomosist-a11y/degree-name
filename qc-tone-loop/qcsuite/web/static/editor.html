<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>qcsuite エディター</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="/static/editor.css">
</head>
<body>
<div id="edNotice" class="ed-notice" role="status">
  <strong>保存していません。本体でプリセットを呼び出し直すと元に戻ります。</strong>
  <span id="edNote" class="ed-note-extra"></span>
</div>
<main>
  <h2>エディター</h2>

  <section class="ed-stage" aria-label="グリッドとパラメーター">
    <div class="ed-toolbar">
      <button type="button" id="btnReload">読み直す</button>
      <button type="button" id="btnUndo" title="Cmd/Ctrl+Z">取り消す</button>
      <button type="button" id="btnRedo" title="Shift+Cmd/Ctrl+Z">やり直す</button>
      <span class="ed-sep" aria-hidden="true"></span>
      <button type="button" id="abA">A を聴く</button>
      <button type="button" id="abB">B を聴く</button>
      <button type="button" id="capA">いまを A に記録</button>
      <button type="button" id="capB">いまを B に記録</button>
      <span id="scene" class="ed-scene"></span>
    </div>
    <div id="edGrid" class="ed-grid"><p class="ed-empty">読み込み中…</p></div>
    <div id="edParams" class="ed-params"></div>
    <p id="edRepo" class="ed-repo"></p>
  </section>

  <section class="panel">
    <h3>履歴</h3>
    <p class="small muted">エディターと「言葉で操作」の変更は同じ履歴に入ります。つまみ 1 回のドラッグ(またはクリック)が取り消しの 1 単位です。</p>
    <div id="history"></div>
  </section>

  <section class="panel">
    <h3>sandbox に保存</h3>
    <p class="small muted">いまのグリッドを sandbox の空きスロットに保存する計画を作ります。まず計画(dry run)だけを作り、内容を確認してから実行します。エディターの操作だけでは保存されません。</p>
    <div class="row"><input id="saveName" placeholder="保存する名前"><button id="btnSave">計画を見る</button></div>
  </section>
</main>
<script src="/static/common.js"></script>
<script src="/static/editor_core.js"></script>
<script src="/static/editor.js"></script>
</body>
</html>
